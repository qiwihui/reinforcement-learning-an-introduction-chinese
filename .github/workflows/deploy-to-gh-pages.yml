name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Setup Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: pip
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
    - name: Build sphinx documentation
      run: |
        make html
    - name: Preserve Read the Docs URLs
      run: |
        mkdir -p build/html/zh-cn/latest
        rsync -a --exclude='zh-cn' build/html/ build/html/zh-cn/latest/
    - name: Setup github pages domain
      run: |
        touch build/html/.nojekyll
        echo "${{ secrets.GH_DOMAIN }}" > build/html/CNAME
    - name: Deploy
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        branch: gh-pages
        folder: build/html
